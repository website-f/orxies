# orxies — self-hosted deployment platform.
#
# Two containers:
#   orxies        the edge + control plane + admin UI (unprivileged).
#   orxies-agent  the orchestration agent that talks to Docker to build
#                 and run your projects. It is the ONLY component with
#                 Docker access; the control plane drives it over a
#                 loopback unix socket authenticated with a shared key.
#
# One-time per VPS:
#   sudo mkdir -p /opt/orxies && sudo chown $USER:$USER /opt/orxies
#   cd /opt/orxies && git clone <this-repo> . && cd orxies
#   cp config.example.yml config.yml && nano config.yml   # acme_email + admins
#   docker compose up -d
#
# Add a project from the admin UI (Projects → New project), or a plain
# reverse-proxy/static site (Sites → Add site). Hot-reloads on change.

name: orxies

services:
  orxies:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${ORXIES_VERSION:-dev}
    image: orxies:${ORXIES_VERSION:-dev}
    restart: always
    # Host networking: binds 80/443 directly and can reach any container
    # (including project containers the agent starts) published on the
    # host's 127.0.0.1:<port>. Admin UI stays loopback-only via config.yml.
    network_mode: host
    volumes:
      - ./config.yml:/etc/orxies/config.yml:ro
      - ./sites:/etc/orxies/sites
      - ./certs:/etc/orxies/certs
      - ./data:/etc/orxies/data                 # SQLite state + secrets (persistent)
      - ./www:/etc/orxies/www:ro                # static-site roots
      - orxies-run:/run/orxies                  # shared agent socket
      # Security page (read-only). If a path doesn't exist on the host,
      # Docker creates a DIRECTORY there and the page will report the
      # source as unreadable — create the file or drop the line instead.
      - /var/log/auth.log:/var/log/auth.log:ro           # SSH brute-force + accepted logins
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro   # ban / unban history
    environment:
      TZ: ${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE                        # bind <1024 as non-root
    # The host auth logs are mode 640 root:adm, and this container runs
    # unprivileged. adm (gid 4 on Debian/Ubuntu) is the least privilege
    # that lets the Security page read them; without it the page renders
    # an explicit "unreadable" notice rather than empty panels.
    group_add:
      - "4"
    deploy:
      resources:
        limits:
          memory: ${ORXIES_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  orxies-agent:
    build:
      context: .
      target: agent
      args:
        VERSION: ${ORXIES_VERSION:-dev}
    image: orxies-agent:${ORXIES_VERSION:-dev}
    restart: always
    depends_on:
      - orxies
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # THE privilege — kept to this one container
      - ./data:/etc/orxies/data:ro                  # read the shared agent key
      - orxies-run:/run/orxies                       # serve the socket the control plane dials
    environment:
      TZ: ${TZ:-UTC}
    security_opt:
      - no-new-privileges:true

volumes:
  orxies-run:
