{{define "login"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07091a">
<meta name="color-scheme" content="dark">
<title>Sign in · jobcloud</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form method="post" action="/login" class="login-card form">
  <div class="brand center">
    <span class="logo">⚡</span>
    <span class="title">jobcloud</span>
  </div>
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <input type="hidden" name="next" value="{{.Next}}">
  {{if eq .Stage "totp"}}
    <h2>Two-factor authentication</h2>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <p class="muted small hint">Enter the 6-digit code from your authenticator app.</p>
    <input type="hidden" name="pending" value="{{.Pending}}">
    <label>Authentication code
      <input type="text" name="otp" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]*" maxlength="6" required autofocus>
    </label>
    <button type="submit" class="btn primary block">Verify</button>
  {{else}}
    <h2>Sign in to continue</h2>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn primary block">Sign in</button>
  {{end}}
</form>
</body>
</html>
{{end}}
